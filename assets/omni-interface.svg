<svg width="1400" height="900" viewBox="0 0 1400 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1020"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#121A2C"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A855F7"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>

  <g opacity="0.2">
    <circle cx="130" cy="120" r="220" fill="#8B5CF6"/>
    <circle cx="1260" cy="760" r="250" fill="#22D3EE"/>
    <circle cx="1040" cy="150" r="180" fill="#34D399"/>
  </g>

  <rect x="80" y="55" width="1240" height="790" rx="24" fill="url(#panel)" stroke="#2A3555"/>

  <rect x="110" y="90" width="1180" height="58" rx="14" fill="#0F172A" stroke="#24314E"/>
  <circle cx="150" cy="119" r="8" fill="#f87171"/>
  <circle cx="178" cy="119" r="8" fill="#fbbf24"/>
  <circle cx="206" cy="119" r="8" fill="#4ade80"/>
  <text x="246" y="128" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700">OMNI</text>
  <text x="1030" y="128" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="18">Model: openrouter/free</text>

  <rect x="110" y="180" width="1180" height="600" rx="18" fill="#0B1220" stroke="#22304E"/>

  <rect x="150" y="220" width="1100" height="92" rx="18" fill="#111827" stroke="#2E3E5D"/>
  <text x="178" y="262" fill="#8B5CF6" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">🌌  O M N I   C L I</text>
  <text x="178" y="292" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="18">Desktop &amp; Web Intelligence Agent</text>

  <rect x="150" y="336" width="392" height="368" rx="18" fill="#0F172A" stroke="#2B3C5A"/>
  <text x="178" y="370" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Core Commands</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#E2E8F0">
    <text x="178" y="414"><tspan fill="#86efac" font-weight="700">/upload</tspan>  • Load documents into the local knowledge base</text>
    <text x="178" y="456"><tspan fill="#93c5fd" font-weight="700">/model</tspan>  • Switch LLM backend</text>
    <text x="178" y="498"><tspan fill="#fcd34d" font-weight="700">/clear</tspan>  • Clear terminal workspace</text>
    <text x="178" y="540"><tspan fill="#fca5a5" font-weight="700">/exit</tspan>  • Exit the session</text>
  </g>

  <rect x="575" y="336" width="675" height="368" rx="18" fill="#0B1120" stroke="#2B3C5A"/>
  <text x="610" y="372" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">💬 Conversation</text>

  <rect x="610" y="400" width="594" height="64" rx="12" fill="#111827" stroke="#2C3B59"/>
  <text x="630" y="440" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20">⚡ You (openrouter/free) › Summarize this research topic</text>

  <rect x="610" y="488" width="594" height="164" rx="12" fill="#101A2B" stroke="#2B3C5A"/>
  <text x="632" y="522" fill="#22D3EE" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">🤖 Omni</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#E2E8F0">
    <text x="632" y="555">• I will search your local knowledge base first.</text>
    <text x="632" y="580">• If needed, I will query the web and extract the most relevant pages.</text>
    <text x="632" y="605">• I can generate notes, summaries, or export results to markdown/PDF.</text>
  </g>

  <rect x="610" y="670" width="280" height="12" rx="6" fill="#1E293B"/>
  <rect x="610" y="670" width="180" height="12" rx="6" fill="url(#accent)" filter="url(#glow)"/>

  <text x="255" y="820" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="16">A terminal-first AI research workflow with local Retrieval-Augmented Generation and web search.</text>
</svg>
